[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-checker"
version = "0.1.0"
description = "Local five-layer security checks for AI agent repositories and runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "Flask>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
ai-security-check = "checker.cli:main"

[tool.setuptools]
packages = ["checker"]

[tool.setuptools.package-data]
checker = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
